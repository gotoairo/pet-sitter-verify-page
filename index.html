<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Pet Sitter in Florence — Verifica email</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(90deg,
        #0A3771 0%,
        #0E6E96 12%,
        #1FA5DC 26%,
        #1FA5DC 40%,
        #3AA3CF 50%,
        #4AA1C7 62%,
        #5BA0BE 74%,
        #6B9EB7 85%,
        #7B9DB0 93%,
        #8C9BA7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .page {
      display: flex;
      align-items: center;
      gap: 48px;
      max-width: 960px;
      width: 100%;
    }
    .logo { flex: 1; display: flex; justify-content: center; }
    .logo img {
      width: 100%;
      max-width: 380px;
      height: auto;
    }
    .card {
      flex: 1;
      background: #2C3E50;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 12px 32px rgba(28, 54, 70, 0.35);
      text-align: center;
    }
    .card .title {
      color: #FFFFFF;
      font-weight: 800;
      font-size: 26px;
      line-height: 1.3;
      letter-spacing: 0.5px;
    }
    .card .title::before {
      content: "";
      display: block;
      width: 56px;
      height: 4px;
      border-radius: 2px;
      background: var(--accent, #27AE60);
      margin: 0 auto 20px;
    }
    .card .subtitle {
      margin-top: 16px;
      color: #D8E0E6;
      font-size: 15px;
      line-height: 1.5;
    }
    @media (max-width: 720px) {
      body {
        padding: 24px;
        background: linear-gradient(90deg,
          #0A3771 0%,
          #0E6E96 25%,
          #1FA5DC 38%,
          #1FA5DC 62%,
          #55A0C1 74%,
          #719EB4 87%,
          #8C9BA7 100%);
      }
      .page { flex-direction: column; gap: 28px; }
      .logo img { max-width: 260px; }
      .card { width: 100%; padding: 32px 24px; }
      .card .title { font-size: 22px; }
    }
  </style>
